name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PING_BASE: http://127.0.0.1:18080/test-monitor-id
    steps:
      - uses: actions/checkout@v4

      - name: Start the local ping server (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          nohup node test/server.js 18080 "$RUNNER_TEMP/requests.jsonl" > "$RUNNER_TEMP/server.log" 2>&1 &

      - name: Start the local ping server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath node -WindowStyle Hidden -ArgumentList 'test/server.js', '18080', "$env:RUNNER_TEMP\requests.jsonl"

      - name: Wait for the server
        shell: bash
        run: |
          node -e '
            const net = require("net");
            let n = 0;
            (function tryOnce() {
              const s = net.connect(18080, "127.0.0.1", () => { s.end(); process.exit(0); });
              s.on("error", () => { if (++n > 50) process.exit(1); setTimeout(tryOnce, 200); });
            })();'

      - name: Make a body over the size limit
        id: big
        shell: bash
        # 4,000 three-byte characters = 12,000 bytes; the action keeps whole
        # characters up to 10,000 bytes, so 3,333 of them (9,999 bytes).
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "body=" + "€".repeat(4000) + "\n")'

      - name: start
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: start
          run-id: run-1
      - name: success with a body
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: success
          run-id: run-1
          body: all good
      - name: failure with an oversized body
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: failure
          run-id: run-2
          body: ${{ steps.big.outputs.body }}
      - name: cancelled (default sends fail)
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: cancelled
          run-id: run-3
      - name: cancelled with on-cancelled skip (sends nothing)
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: cancelled
          on-cancelled: skip
      - name: exit code 0
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: '0'
          run-id: run-4
      - name: exit code 3
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: '3'
          run-id: run-5
      - name: log
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: log
          run-id: run-6
          body: a note
      - name: default run id
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: start
      - name: trailing slash on the URL
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}/
          status: success
          run-id: run-7
      - name: retried after a 503
        uses: ./
        with:
          ping-url: ${{ env.PING_BASE }}
          status: success
          run-id: retry-once

      - name: unreachable host does not fail the job by default
        uses: ./
        with:
          ping-url: http://127.0.0.1:1/test-monitor-id
          status: success
      - name: unreachable host with fail-on-error
        id: strict
        continue-on-error: true
        uses: ./
        with:
          ping-url: http://127.0.0.1:1/test-monitor-id
          status: success
          fail-on-error: 'true'
      - name: fail-on-error failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = failure

      - name: The URL is masked and never printed
        shell: bash
        run: |
          out="$RUNNER_TEMP/action-out.txt"
          env "INPUT_PING-URL=http://127.0.0.1:18080/mask-test-monitor-id" INPUT_STATUS=log \
            INPUT_RUN-ID=mask node index.js > "$out"
          # The first two lines register the URL and the monitor id as secrets.
          test "$(sed -n 1p "$out")" = "::add-mask::http://127.0.0.1:18080/mask-test-monitor-id"
          test "$(sed -n 2p "$out")" = "::add-mask::mask-test-monitor-id"
          # Nothing else the action prints contains either.
          if grep -v '^::add-mask::' "$out" | grep -q 'mask-test-monitor-id'; then
            echo "the ping URL was printed"; exit 1
          fi
          grep -q 'sent log ping' "$out"

      - name: Check what the server received
        shell: bash
        env:
          DEFAULT_RID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          p=/test-monitor-id
          node test/check.js "$RUNNER_TEMP/requests.jsonl" "[
            {\"path\":\"$p/start\",\"rid\":\"run-1\",\"method\":\"POST\",\"bytes\":0},
            {\"path\":\"$p\",\"rid\":\"run-1\",\"body\":\"all good\"},
            {\"path\":\"$p/fail\",\"rid\":\"run-2\",\"bytes\":9999},
            {\"path\":\"$p/fail\",\"rid\":\"run-3\",\"body\":\"GitHub Actions job cancelled\"},
            {\"path\":\"$p/0\",\"rid\":\"run-4\"},
            {\"path\":\"$p/3\",\"rid\":\"run-5\"},
            {\"path\":\"$p/log\",\"rid\":\"run-6\",\"body\":\"a note\"},
            {\"path\":\"$p/start\",\"rid\":\"$DEFAULT_RID\"},
            {\"path\":\"$p\",\"rid\":\"run-7\"},
            {\"path\":\"$p\",\"rid\":\"retry-once\"},
            {\"path\":\"/mask-test-monitor-id/log\",\"rid\":\"mask\"}
          ]"
